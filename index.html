<style>
:root{
  --bg:#e4e8ec; --panel:#fbfcfd; --ink:#132131; --muted:#5b6876; --line:#dde2e8; --line2:#c7ced7;
  --accent:#132131; --accent-ink:#fff; --mark:#2357c6; --ok:#1d8656; --bad:#cc3a2b; --blue:#2357c6;
  --floor:#f1f3f6; --paint:#dfe6ef; --frame:#a9b3be; --court-line:#132131;
  --us:#2357c6; --opp:#5b6876;
  --r:6px; --shadow:none;
  --disp:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:.005em;margin:0;line-height:1}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
a{color:var(--mark)}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#eef2f6;display:flex;align-items:center;gap:22px;padding:0 20px;height:54px}
.brand{display:flex;align-items:center;gap:9px;font:800 26px/1 var(--disp);letter-spacing:.02em;cursor:pointer}
.brand i.x{width:20px;height:20px;border-radius:50%;border:3px solid #fff;display:inline-block;position:relative}
.brand i.x:after{content:"";position:absolute;left:3px;right:3px;top:100%;height:7px;margin-top:-1px;border:2px solid #fff;border-top:0;border-radius:0 0 4px 4px;opacity:.55}
.brand .by{font:500 12px/1 var(--body);color:#a9b5c2;letter-spacing:0;align-self:flex-end;margin:0 0 4px 2px;white-space:nowrap}
.foot{max-width:1320px;margin:-50px auto 0;padding:22px 20px 34px;border-top:1px solid var(--line2);font-size:13px;color:var(--muted)}
.foot span{font:800 16px var(--disp);color:var(--ink)}
.foot b{color:var(--ink);font-weight:600}
.nav{display:flex;gap:2px;align-self:stretch}
.nav button{background:none;border:0;color:#a9b5c2;padding:0 14px;cursor:pointer;font-weight:600;box-shadow:inset 0 -3px 0 transparent}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;box-shadow:inset 0 -3px 0 #fff}
.nav button:disabled{opacity:.35;cursor:default}
.top .sp{flex:1}
.save-state{font-size:12.5px;color:#a9b5c2;display:flex;align-items:center;gap:6px}
.save-state b{width:8px;height:8px;border-radius:50%;background:#77818c;display:inline-block}
.save-state.ok b{background:#46c47e}.save-state.busy b{background:#e5b33a}.save-state.err b{background:#e0533f}
.top .btn{background:transparent;border-color:#3a4a5c;color:#eef2f6}
.top .btn:hover{border-color:#8796a6}
main{max-width:1320px;margin:0 auto;padding:24px 20px 90px}
/* piezas generales */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r)}
.pad{padding:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:5px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.pri,.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover,.btn.dark:hover{background:#24364b}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line2);border-radius:5px;padding:8px 10px;background:#fff;font-size:15px;color:var(--ink);font-weight:500}
textarea{resize:vertical}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font:600 13px var(--body);color:var(--muted)}
.pill{display:inline-block;font:600 12px var(--body);padding:2px 8px;border-radius:3px}
.pill.w{background:#d6efe1;color:#14603d}.pill.l{background:#f8dcd8;color:#97291d}.pill.d{background:#e4e8ec;color:#45515e}
.chip{border:1px solid var(--line2);background:#fff;border-radius:4px;padding:5px 9px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--ink)}
.chip b{font:700 16px/1 var(--disp)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.zero{opacity:.45}
.toast-box{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:9px 15px;border-radius:5px;font-weight:600;box-shadow:0 10px 26px -10px rgba(19,33,49,.5);animation:tin .18s ease-out}
.toast.warn{background:#94570b}.toast.err{background:#a2281b}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.modal-bg{position:fixed;inset:0;background:rgba(19,33,49,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:8px;max-width:560px;width:100%;padding:24px;box-shadow:0 24px 60px -20px rgba(19,33,49,.6);max-height:90vh;overflow:auto}
.modal h3{font-size:28px;margin-bottom:10px}
/* inicio */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-bottom:30px}
.hero h1{font-size:64px;line-height:.92;margin:0 0 16px;letter-spacing:-.005em}
.hero > .card:first-child{min-height:0;background:var(--ink);color:#eef2f6;border-color:var(--ink);position:relative;overflow:hidden}
.hero > .card:first-child p,.hero > .card:first-child .muted{color:#b8c3cf;max-width:56ch}
.hero > .card:first-child .btn{background:transparent;color:#fff;border-color:#4a5b6e}
.hero > .card:first-child .btn:hover{border-color:#fff}
.hero > .card:first-child:after{content:"";position:absolute;right:-90px;bottom:-150px;width:340px;height:340px;border-radius:50%;border:2px solid rgba(255,255,255,.09);box-shadow:0 0 0 80px rgba(255,255,255,.025)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.gcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.gcard .sc{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gcard .sc .num{font-size:44px;font-weight:800;line-height:1}
.gsc{display:grid;gap:2px}
.gsc div{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:4px 0}

/* etiquetado */

.vbox{background:#0c141d;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}

.vdrop{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:#cbd5df;text-align:center;padding:20px;border:2px dashed #2f3f51;border-radius:var(--r)}
.vdrop h3{color:#fff;font-size:30px}
.vdrop .btn{background:transparent;color:#fff;border-color:#4a5b6e}
.vdrop .btn.pri{background:#fff;color:var(--ink);border-color:#fff}

.vdrop.over{border-color:#fff;background:rgba(255,255,255,.05)}
.vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.vbar .time{font:700 20px var(--disp);min-width:120px;font-variant-numeric:tabular-nums}
.scrub{flex:1;min-width:160px;accent-color:var(--ink)}
.status{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.jbig{font:800 46px/1 var(--disp);min-width:86px;text-align:center;background:var(--ink);color:#fff;border-radius:4px;padding:6px 8px}
.jbig small{display:block;font:600 11px var(--body);color:#a9b5c2;margin-bottom:2px}
.live{font:800 34px/1 var(--disp);text-align:right;font-variant-numeric:tabular-nums}
.live small{display:block;font:600 12px var(--body);color:var(--muted)}
.court-wrap{position:relative}
.court{width:100%;display:block;cursor:crosshair;user-select:none}
.court-msg{position:absolute;left:8px;top:8px;background:rgba(19,33,49,.88);color:#fff;font-weight:600;font-size:13px;padding:5px 9px;border-radius:4px;pointer-events:none}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 14px;font-size:13px}

kbd{display:inline-block;min-width:22px;text-align:center;font:700 12px/1 var(--body);background:#fff;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:4px 5px}

.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px}

.marks{display:flex;gap:6px;flex-wrap:wrap}

.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}

.seg button.on{background:var(--ink);color:#fff}
/* análisis: marcador */

.ghead .team{display:flex;align-items:center;gap:14px;padding:20px 26px;background:var(--tc);color:var(--ti)}

.board{background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 34px;gap:6px}
.board .when{font-size:13px;color:#a9b5c2;white-space:nowrap}
.bigscore{font:800 104px/.85 var(--disp);display:flex;gap:22px;align-items:center;font-variant-numeric:tabular-nums}
.bigscore .lo{color:#6f7f90}
.bigscore .sep{width:14px;height:5px;background:#4a5b6e;display:block}
.board .tagged{font-size:12.5px;color:#a9b5c2}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--ink)}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .eyebrow{font-size:13px}
.kpi .v{font:800 38px/1.05 var(--disp);font-variant-numeric:tabular-nums}

.fv-right{padding:18px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.clips{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:5px}
.clip{display:grid;grid-template-columns:54px 34px 46px 1fr auto;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;align-items:center}

.clip.now{background:#e3ebf8}

.scroll-x{overflow-x:auto}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.ai-out{white-space:pre-wrap}
.ai-out h3{font-size:26px;margin-bottom:6px}
.ai-out ul{margin:6px 0 0;padding-left:20px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto;padding:4px}
.msg{padding:10px 13px;border-radius:6px;max-width:88%;white-space:pre-wrap;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff}
.msg.a{align-self:flex-start;background:#e9edf1}

#ytWrap{position:absolute;z-index:5;display:none;background:#000;border-radius:var(--r);overflow:hidden}

  .fis-warn{margin:10px 0 4px;padding:10px 14px;border-left:3px solid #c98a12;background:#fbf3e2;font-size:14px;border-radius:0 4px 4px 0}

  .clip.idrow select{grid-column:1/2}

}

<script>
"use strict";
/* ============================================================
   Utilidades
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = v => Math.round(v * 100) / 100;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function fmtT(s) {
  if (s == null || isNaN(s)) return "--:--";
  s = Math.max(0, s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = Math.floor(s % 60);
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
}
function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind ? 3800 : 2200);
}
function modal(html, onMount) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("mousedown", e => { if (e.target === bg) close(); });
  onMount && onMount(bg.firstElementChild, close);
  return close;
}
function confirmBox(text, okLabel = "Confirmar", danger = true) {
  return new Promise(res => {
    modal(`<h3>¿Seguro?</h3><p>${esc(text)}</p><div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn" data-x>Cancelar</button><button class="btn ${danger ? "dark" : "pri"}" data-ok>${esc(okLabel)}</button></div>`,
      (m, close) => {
        m.querySelector("[data-x]").onclick = () => { close(); res(false); };
        m.querySelector("[data-ok]").onclick = () => { close(); res(true); };
      });
  });
}
function contrastInk(hex) {
  const c = (hex || "#888").replace("#", "");
  const n = parseInt(c.length === 3 ? c.split("").map(x => x + x).join("") : c, 16);
  const r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#132131" : "#fff";
}
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fmtDate(d) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); return m ? `${+m[3]} de ${MESES[+m[2] - 1]} de ${m[1]}` : (d || ""); }
const initials = n => (n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();

/* ============================================================
   Cancha (FIBA 28 x 15 m). Coordenadas guardadas en 0-100.
   Normalizadas: nuestro equipo SIEMPRE ataca hacia la derecha.
   ============================================================ */
const CW = 28, CH = 15, RIM_X = 28 - 1.575, RIM_Y = 7.5;
const toM = (x, y) => [x / 100 * CW, y / 100 * CH];
const toP = (mx, my) => [mx / CW * 100, my / CH * 100];
function distRim(x, y) { const [mx, my] = toM(x, y); return Math.hypot(mx - RIM_X, my - RIM_Y); }
function isThreeLoc(x, y) {
  const [mx, my] = toM(x, y);
  if (mx > CW - 2.99) return my < 0.9 || my > CH - 0.9;
  return Math.hypot(mx - RIM_X, my - RIM_Y) > 6.75;
}
function zoneOf(x, y) {
  const [mx, my] = toM(x, y);
  if (mx < CW / 2) return "back";
  if (isThreeLoc(x, y)) {
    if (mx > CW - 2.99 - 0.6) return my < RIM_Y ? "c3izq" : "c3der";
    return "t3";
  }
  if (mx >= CW - 5.8 && Math.abs(my - RIM_Y) <= 2.45) return "pintura";
  return "media";
}
const ZONES = { pintura: "Pintura", media: "Media distancia", c3izq: "Triple esquina (sup.)", c3der: "Triple esquina (inf.)", t3: "Triple frontal / 45°", back: "Campo propio" };

function courtSVG({ id = "", cls = "court", half = false, inner = "", defs = "", under = "" } = {}) {
  const side = `
    <rect x="0" y="5.05" width="5.8" height="4.9" fill="${under ? "none" : "var(--paint)"}" stroke="var(--court-line)" stroke-width=".06"/>
    <circle cx="5.8" cy="7.5" r="1.8" fill="none" stroke="var(--court-line)" stroke-width=".06"/>
    <path d="M1.575 6.25 A1.25 1.25 0 0 1 1.575 8.75" fill="none" stroke="var(--court-line)" stroke-width=".05"/>
    <path d="M0 0.9 H2.99 A6.75 6.75 0 0 1 2.99 14.1 H0" fill="none" stroke="var(--court-line)" stroke-width=".06"/>
    <line x1="1.2" y1="6.6" x2="1.2" y2="8.4" stroke="var(--court-line)" stroke-width=".1"/>
    <circle cx="1.575" cy="7.5" r=".25" fill="none" stroke="#f26a1b" stroke-width=".08"/>`;
  const vb = half ? "13.4 -0.3 14.9 15.6" : "-0.3 -0.3 28.6 15.6";
  return `<svg ${id ? `id="${id}"` : ""} class="${cls}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b3e"/></marker>
      <marker id="arr-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6475"/></marker>
      ${defs}
    </defs>
    <rect x="-0.3" y="-0.3" width="28.6" height="15.6" rx=".25" fill="var(--floor)" stroke="var(--frame)" stroke-width=".05"/>
    <rect x="0" y="0" width="28" height="15" fill="var(--floor)"/>${under}<rect x="0" y="0" width="28" height="15" fill="none" stroke="var(--court-line)" stroke-width=".07"/>
    <line x1="14" y1="0" x2="14" y2="15" stroke="var(--court-line)" stroke-width=".06"/>
    <circle cx="14" cy="7.5" r="1.8" fill="none" stroke="var(--court-line)" stroke-width=".06"/>
    <g>${side}</g>
    <g transform="translate(28,0) scale(-1,1)">${side}</g>
    <g class="layer">${inner}</g>
  </svg>`;
}
function svgPoint(svg, ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return toP(clamp(p.x, 0, CW), clamp(p.y, 0, CH));
}

/* ============================================================
   Modelo de datos
   evento: {id, t, type, team:'us'|'opp', j, x, y, d:{...}, hl}
   ============================================================ */
const TYPE_LABEL = { fg: "Tiro", ft: "Libre", reb: "Rebote", to: "Pérdida", stl: "Robo", blk: "Tapa", foul: "Falta", pass: "Pase", opp: "Rival" };
const TYPE_COLOR = { fg: "#e8641b", ft: "#e8a31b", reb: "#2463c9", to: "#c43c2c", stl: "#1f8a4c", blk: "#7b3fc4", foul: "#7a6f5d", pass: "#8aa1c4", opp: "#4a5568" };
const CLIP = { fg: [6, 2], ft: [3, 2], reb: [4, 2], to: [5, 2], stl: [5, 2], blk: [5, 2], foul: [4, 2], pass: [3, 1.5], opp: [6, 2] };
const KEYS = {
  a: { type: "fg", d: { pts: 2, made: true } }, z: { type: "fg", d: { pts: 2, made: false } },
  s: { type: "fg", d: { pts: 3, made: true } }, x: { type: "fg", d: { pts: 3, made: false } },
  d: { type: "ft", d: { made: true } }, c: { type: "ft", d: { made: false } },
  r: { type: "reb", d: { off: false } }, e: { type: "reb", d: { off: true } },
  p: { type: "to", d: { kind: "perdida" } }, b: { type: "stl", d: {} }, g: { type: "blk", d: {} },
  f: { type: "foul", d: { kind: "personal" } }, k: { type: "pass", d: { ok: true } }, l: { type: "pass", d: { ok: false } },
  u: { type: "opp", d: { pts: 1 } }, o: { type: "opp", d: { pts: 2 } }, i: { type: "opp", d: { pts: 3 } }
};
const LEGEND = [
  ["A", "Doble convertido"], ["Z", "Doble errado"], ["S", "Triple convertido"], ["X", "Triple errado"],
  ["D", "Libre convertido"], ["C", "Libre errado"], ["R", "Rebote defensivo"], ["E", "Rebote ofensivo"],
  ["V", "Asistencia → último tiro"], ["N", "And-one → último tiro"], ["P", "Pérdida"], ["B", "Robo"],

/* Mapa de calor suave: acumula en una grilla fina (10 cm), difumina con un núcleo gaussiano y pinta en un canvas. */
const HEAT_STOPS = [[0, 253, 230, 138, 0], [0.18, 253, 214, 102, 0.55], [0.45, 245, 150, 40, 0.75], [0.72, 220, 50, 38, 0.85], [1, 122, 20, 30, 0.92]];

  a.fill(0);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const v = b[y * W + x]; if (!v) continue; for (let i = -rad; i <= rad; i++) { const Y = y + i; if (Y >= 0 && Y < H) a[Y * W + x] += v * k[i + rad]; } }

  const ctx = cv.getContext("2d"), img = ctx.createImageData(W, H), d = img.data;

}

function makeDemo(seed = 14) { const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const roster = [["4", "Benítez"], ["5", "Ojeda"], ["7", "Ramírez"], ["8", "Duarte"], ["10", "Sosa"], ["11", "Acuña"], ["14", "Gauna"], ["21", "Villalba"], ["32", "Ayala"], ["35", "Cabrera"]].map(([j, n]) => ({ j, n }));
  const g = newGame({ demo: true, date: new Date().toISOString().slice(0, 10), comp: "Ejemplo", us: { name: "Club Ejemplo", color: "#e8641b" }, opp: { name: "Rival Ejemplo", color: "#2b3a55" }, roster, start: 30, qEnd: [1650, 3300, 5100, 6800], dir: "R" });
  const weight = { "4": 9, "5": 6, "7": 3, "8": 4, "10": 10, "11": 3, "14": 5, "21": 2, "32": 8, "35": 7 };
  const wp = () => { const tot = Object.values(weight).reduce((a, b) => a + b, 0); let r = rnd() * tot; for (const [j, w] of Object.entries(weight)) { r -= w; if (r <= 0) return j; } return "10"; };
  const other = j => { let k; do k = wp(); while (k === j); return k; };
  const loc = (three, close) => {
    let mx, my;
    if (three) { if (rnd() < .25) { mx = CW - 1 - rnd() * 1.6; my = rnd() < .5 ? 0.45 : CH - 0.45; } else { const a = (rnd() - .5) * Math.PI * .8, r = 7 + rnd() * .8; mx = RIM_X - Math.cos(a) * r; my = RIM_Y + Math.sin(a) * r; } }
    else { const a = (rnd() - .5) * Math.PI * .95, r = close ? .4 + rnd() * 1.2 : 2 + rnd() * 4.2; mx = RIM_X - Math.cos(a) * r; my = RIM_Y + Math.sin(a) * r; }
    const [x, y] = toP(clamp(mx, 14.5, CW - .3), clamp(my, .3, CH - .3)); return [r2(x), r2(y)];
  };
  const defLoc = () => { const [x, y] = toP(1.5 + rnd() * 6, 2 + rnd() * 11); return [r2(x), r2(y)]; };
  const ev = []; const add = (t, type, j, d, xy, extra = {}) => ev.push(Object.assign({ id: uid() + ev.length, t: r2(t), type, team: type === "opp" ? "opp" : "us", j: j || null, d, x: xy ? xy[0] : null, y: xy ? xy[1] : null }, extra));
  const segs = [[40, 1640], [1700, 3290], [3360, 5090], [5150, 6790]];
  for (const [a, b] of segs) {
    let t = a + 5, ours = rnd() < .5;
    while (t < b - 25) {
      if (ours) {
        t += 8 + rnd() * 8;
        let j = wp(); const np = Math.floor(rnd() * 4);
        for (let i = 0; i < np; i++) { const k = other(j); add(t, "pass", j, { ok: rnd() > .06 }, null); t += 4 + rnd() * 4; j = k; }
        const r = rnd();
        if (r < .12) { add(t, "to", j, { kind: pick(TO_KINDS.slice(0, 5)) }, loc(false, false)); t += 8; ours = false; continue; }
        if (r < .2) { const m1 = rnd() < .74, m2 = rnd() < .74; add(t + 25, "ft", j, { made: m1 }, toP(CW - 5.8, RIM_Y)); add(t + 45, "ft", j, { made: m2 }, toP(CW - 5.8, RIM_Y)); t += 60; ours = false; continue; }
        const three = rnd() < .33, close = !three && rnd() < .45, made = rnd() < (three ? .34 : close ? .58 : .40);
        const xy = loc(three, close);
        const d = { pts: three ? 3 : 2, made, kind: close ? (rnd() < .08 ? "volcada" : "bandeja") : "tiro" };
        if (made && rnd() < .6) d.ast = other(j);
        if (made && rnd() < .05) d.and1 = true;
        add(t, "fg", j, d, xy, { hl: made && three && rnd() < .3 });
        if (d.and1) add(t + 30, "ft", j, { made: rnd() < .7 }, toP(CW - 5.8, RIM_Y));
        t += 6 + rnd() * 4;
        if (!made) { if (rnd() < .28) { add(t, "reb", wp(), { off: true }, loc(false, true)); t += 2; continue; } }
        ours = false;
      } else {
        t += 26 + rnd() * 18; const r = rnd();
        if (r < .37) add(t, "opp", null, { pts: rnd() < .3 ? 3 : 2 });
        else if (r < .5) { add(t, "opp", null, { pts: 1 }); add(t + 20, "opp", null, { pts: rnd() < .7 ? 1 : 0 }); t += 20; }
        else if (r < .6) { add(t, "stl", wp(), {}, defLoc()); t += 3; ours = true; continue; }
        else if (r < .65) { add(t, "blk", wp(), {}, (() => { const [x, y] = toP(1.2 + rnd() * 2.5, 5.5 + rnd() * 4); return [r2(x), r2(y)]; })()); add(t + 2, "reb", wp(), { off: false }, defLoc()); t += 4; ours = true; continue; }
        else if (r < .72) { add(t, "foul", wp(), { kind: pick(["personal", "en tiro"]) }, defLoc()); }
        else add(t + 2, "reb", wp(), { off: false }, (() => { const [x, y] = toP(.8 + rnd() * 3.5, 4 + rnd() * 7); return [r2(x), r2(y)]; })());
        t += 6; ours = true;
      }
    }
  }
  g.events = ev.filter(e => !(e.type === "opp" && !e.d.pts)).sort((a, b) => a.t - b.t);
  return g;
}

/* ============================================================
   Inicio
   ============================================================ */
async function loadSeeds() {
  if (S.viewer || (CONFIG.supabaseUrl && SHARED_ID)) return;
  // Partidos que vienen incluidos con la página (partidos/index.json): se agregan una sola vez
  try {
    const r = await fetch("partidos/index.json", { cache: "no-store" }); if (!r.ok) return;
    const list = await r.json(); const seen = lsGet("aro.seeded", []); let added = null;
    for (const f of list) {
      if (seen.includes(f.id) || S.games[f.id]) {
        if (!seen.includes(f.id)) seen.push(f.id);
        const ex = S.games[f.id];
        if (ex && f.yt && !ex.yt) { ex.yt = f.yt; ex.ytUrl = "https://youtu.be/" + f.yt; touch(ex); toast("Video de YouTube vinculado a " + ex.us.name + " vs " + ex.opp.name); }
        const rk = f.id + "@" + (f.rev || 1);
        if (ex && f.rev && !seen.includes(rk) && (f.patch || f.replace)) {
          if (f.patch) Object.assign(ex, f.patch);
          if (f.replace) { try { const sg = await (await fetch("partidos/" + f.file, { cache: "no-store" })).json(); for (const key of f.replace) if (sg[key] !== undefined) ex[key] = sg[key]; } catch (e) { } }
          seen.push(rk); touch(ex); toast("Partido actualizado: " + ex.us.name + " vs " + ex.opp.name); if (route !== "inicio") render();
        }
        continue;
      }
      const gr = await fetch("partidos/" + f.file, { cache: "no-store" }); if (!gr.ok) continue;
      const g = Object.assign(newGame(), await gr.json(), { updatedAt: Date.now() });
      S.games[g.id] = g; seen.push(g.id); if (f.rev) seen.push(f.id + "@" + f.rev); added = g; touch(g);
    }
    lsSet("aro.seeded", seen);
    if (added) { setCur(added.id); toast(`Nuevo partido: ${added.us.name} vs ${added.opp.name}`); render(); }
  } catch (e) { }
}
if (!(CONFIG.supabaseUrl && SHARED_ID)) { S.games = lsGet(LS_KEY, {}) || {}; S.cur = lsGet(LS_CUR, null); }
render();
initStore().then(loadSeeds).then(() => render());
</script>
